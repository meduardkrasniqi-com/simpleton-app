name: Linux release

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            deb: amd64
            appimage: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
            deb: arm64
            appimage: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --${{ matrix.arch }} --publish ${{ inputs.publish && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: "true"
      - if: inputs.publish
        run: |
          version=$(node -p "require('./package.json').version")
          cp dist/*.deb "dist/Simpleton-${{ matrix.deb }}.deb"
          cp dist/*.AppImage "dist/Simpleton-${{ matrix.appimage }}.AppImage"
          gh release upload "v$version" "dist/Simpleton-${{ matrix.deb }}.deb" "dist/Simpleton-${{ matrix.appimage }}.AppImage" -R ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.publish
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" dist/*.deb dist/*.AppImage dist/latest-linux*.yml -R simpleton-io/releases --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7
