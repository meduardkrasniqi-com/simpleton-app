appId: io.simpleton.app
productName: Simpleton
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/node-pty/prebuilds/win32-*/**"
protocols:
  - name: Simpleton
    schemes: [simpleton]
asarUnpack:
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  category: Development
  icon: build/icon.png
  executableName: simpleton
  maintainer: Simpleton <03medu@gmail.com>
  synopsis: Run coding agents in parallel
  target:
    - AppImage
    - deb
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, git, lsof]
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: simpleton-io
  repo: simpleton
  releaseType: release
